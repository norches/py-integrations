<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{safe_title}</title>
  {style_block}
</head>
<body>
  <main class="assistant-shell" data-mode="{safe_mode}">
    <section class="hero-panel">
      <div class="hero-copy">
        <span class="eyebrow">С чего начать</span>
        <p>Нажмите готовую подсказку или напишите свою задачу.</p>
      </div>

      <div class="prompt-pills" aria-label="Примеры вопросов">
        <button type="button" data-prompt="Покажи остатки товара Coca-Cola">Сколько товара осталось?</button>
        <button type="button" data-prompt="Найди клиента по телефону +998">Найди клиента</button>
        <button type="button" data-prompt="Сколько продаж было сегодня?">Продажи за сегодня</button>
        <button type="button" data-prompt="Какие заказы ждут оплаты?">Кто ждёт оплату?</button>
        <button type="button" data-prompt="Создай задачу менеджеру: перезвонить клиенту">Создай задачу</button>
        <button type="button" data-prompt="Покажи документы по складу за сегодня">Документы склада</button>
      </div>

      <p class="hint-line">Подсказка вставится в поле ниже. Проверьте текст и нажмите «Отправить».</p>
    </section>

    <section class="chat-panel" aria-label="Чат">
      <div class="message-list" data-messages>
        <article class="message assistant">
          <div class="bubble">{safe_initial_message}</div>
          <div class="setup-actions" data-chatgpt-connect hidden>
            <button class="button primary" type="button" data-chatgpt-connect-button>
              Войти через ChatGPT
            </button>
          </div>
        </article>
      </div>

      <div class="notice-line" data-error>{safe_error}</div>

      <form class="composer" data-chat-form>
        <textarea name="message" rows="2" placeholder="Напишите, что нужно: найти товар, клиента, остатки, продажу..." {chat_disabled}></textarea>
        <button class="send-button" type="submit" {chat_disabled}>Отправить</button>
      </form>
    </section>
  </main>

  <script src="{safe_embed_sdk_url}"></script>
  <script>
    window.__REGOS_CHATGPT_ASSISTANT__ = {app_config_json};

    (function () {{
      const cfg = window.__REGOS_CHATGPT_ASSISTANT__;
      const form = document.querySelector("[data-chat-form]");
      const textarea = form ? form.querySelector("textarea") : null;
      const messages = document.querySelector("[data-messages]");
      const errorLine = document.querySelector("[data-error]");
      const connectBlock = document.querySelector("[data-chatgpt-connect]");
      const connectButton = document.querySelector("[data-chatgpt-connect-button]");
      const promptButtons = document.querySelectorAll("[data-prompt]");
      let embedSessionToken = "";
      let embedAuthenticated = !cfg.embedAuthEnabled || !cfg.chatEnabled;
      let connectWindowOpened = false;

      function appendMessage(role, text, extra) {{
        const item = document.createElement("article");
        item.className = "message " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text || "";
        item.appendChild(bubble);
        if (extra) item.appendChild(extra);
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
        return item;
      }}

      function setBusy(isBusy) {{
        if (!textarea) return;
        const available = Boolean(cfg.chatEnabled && embedAuthenticated);
        textarea.disabled = isBusy || !available;
        const button = form.querySelector("button[type='submit']");
        if (button) button.disabled = isBusy || !available;
      }}

      function showNotice(text) {{
        if (errorLine) errorLine.textContent = text || "";
      }}

      function chatGptConnectUrl() {{
        const raw = String(cfg.chatGptConnectUrl || "").trim();
        if (!raw) return "";
        try {{
          const url = new URL(raw, window.location.href);
          if (cfg.connectedIntegrationId) {{
            url.searchParams.set("connected_integration_id", cfg.connectedIntegrationId);
          }}
          url.searchParams.set("return_url", window.location.href);
          return url.toString();
        }} catch (error) {{
          return raw;
        }}
      }}

      function openChatGptLogin() {{
        const url = chatGptConnectUrl();
        if (!url) {{
          appendMessage("assistant", "Вход через ChatGPT пока не настроен. Обратитесь к администратору.");
          return;
        }}
        connectWindowOpened = true;
        window.open(url, "_blank", "noopener,noreferrer");
      }}

      async function callIntegration(action, data) {{
        const payloadData = Object.assign({{}}, data || {{}});
        if (embedSessionToken) payloadData.embed_session_token = embedSessionToken;
        const response = await fetch(cfg.apiUrl, {{
          method: "POST",
          headers: {{"Content-Type": "application/json"}},
          body: JSON.stringify({{
            action: action,
            connected_integration_id: cfg.connectedIntegrationId,
            data: payloadData
          }})
        }});
        const payload = await response.json();
        if (!response.ok || payload.ok === false) {{
          const detail = payload.result && payload.result.description
            ? payload.result.description
            : "Не получилось выполнить запрос.";
          throw new Error(String(detail));
        }}
        return payload.result;
      }}

      function initEmbedAuth() {{
        if (!cfg.chatEnabled) {{
          embedAuthenticated = false;
          setBusy(false);
          return;
        }}
        if (!cfg.embedAuthEnabled) {{
          embedAuthenticated = true;
          setBusy(false);
          return;
        }}

        if (window.parent === window) {{
          embedAuthenticated = false;
          showNotice("Откройте помощника внутри REGOS.");
          setBusy(false);
          return;
        }}

        showNotice("");
        setBusy(false);

        if (!window.RegosEmbedSDK || typeof window.RegosEmbedSDK.init !== "function") {{
          embedAuthenticated = false;
          showNotice("Обновите страницу или откройте помощника из REGOS.");
          setBusy(false);
          return;
        }}

        try {{
          window.RegosEmbedSDK.init({{
            connectedIntegrationId: cfg.connectedIntegrationId,
            clientId: cfg.oauthClientId,
            backendUrl: cfg.embedBackendUrl,
            parentOrigin: cfg.embedParentOrigin || undefined,
            debug: false,
            onSuccess: function (data) {{
              const token = data && (data.embed_session_token || data.embedSessionToken);
              if (!token) {{
                embedAuthenticated = false;
                showNotice("Попробуйте обновить страницу.");
                setBusy(false);
                return;
              }}
              embedSessionToken = String(token);
              embedAuthenticated = true;
              showNotice("");
              appendMessage("assistant", "Готово, можно писать задачу.");
              setBusy(false);
              if (textarea) textarea.focus();
            }},
            onError: function () {{
              embedAuthenticated = false;
              showNotice("Попробуйте обновить страницу или открыть помощника заново.");
              setBusy(false);
            }}
          }});
        }} catch (error) {{
          embedAuthenticated = false;
          showNotice("Попробуйте обновить страницу или открыть помощника заново.");
          setBusy(false);
        }}
      }}

      function confirmationControls(pending) {{
        const controls = document.createElement("div");
        controls.className = "confirm-row";
        const approve = document.createElement("button");
        approve.type = "button";
        approve.className = "button primary";
        approve.textContent = "Подтвердить";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "button secondary";
        cancel.textContent = "Отмена";
        controls.appendChild(approve);
        controls.appendChild(cancel);

        async function submit(approved) {{
          approve.disabled = true;
          cancel.disabled = true;
          try {{
            const result = await callIntegration("confirm_action", {{
              confirmation_id: pending.confirmation_id,
              approved: approved
            }});
            appendMessage("assistant", approved ? JSON.stringify(result.result || result, null, 2) : "Хорошо, отменил.");
          }} catch (error) {{
            appendMessage("assistant", error.message || "Не получилось подтвердить действие.");
          }}
        }}

        approve.addEventListener("click", () => submit(true));
        cancel.addEventListener("click", () => submit(false));
        return controls;
      }}

      promptButtons.forEach(function (button) {{
        button.addEventListener("click", function () {{
          const text = button.getAttribute("data-prompt") || "";
          if (!cfg.connectedIntegrationId) {{
            appendMessage("assistant", "Откройте помощника внутри REGOS.");
            return;
          }}
          if (!cfg.chatEnabled) {{
            appendMessage("assistant", "Сначала нажмите «Войти через ChatGPT».");
            return;
          }}
          if (textarea) {{
            textarea.value = text;
            textarea.focus();
            showNotice("Проверьте текст ниже и нажмите «Отправить».");
          }}
        }});
      }});

      if (form) {{
        form.addEventListener("submit", async function (event) {{
          event.preventDefault();
          const text = textarea.value.trim();
          if (!text) return;
          textarea.value = "";
          appendMessage("user", text);
          setBusy(true);
          try {{
            const result = await callIntegration("chat", {{message: text}});
            if (result.status === "requires_confirmation" && result.pending_action) {{
              appendMessage(
                "assistant",
                result.reply || "Нужно подтверждение.",
                confirmationControls(result.pending_action)
              );
            }} else {{
              appendMessage("assistant", result.reply || JSON.stringify(result, null, 2));
            }}
          }} catch (error) {{
            appendMessage("assistant", error.message || "Не получилось выполнить запрос.");
          }} finally {{
            setBusy(false);
            textarea.focus();
          }}
        }});
      }}

      if (!cfg.chatEnabled && connectBlock && cfg.connectedIntegrationId) {{
        connectBlock.hidden = false;
      }}
      if (connectButton) {{
        connectButton.addEventListener("click", openChatGptLogin);
      }}
      window.addEventListener("focus", function () {{
        if (connectWindowOpened && !cfg.chatEnabled) {{
          window.location.reload();
        }}
      }});

      if (!cfg.chatEnabled) {{
        showNotice("Нажмите «Войти через ChatGPT», чтобы начать.");
      }}
      setBusy(false);
      if (cfg.chatEnabled) {{
        initEmbedAuth();
      }}
    }})();
  </script>
</body>
</html>
